{{ define "main" }}
<div class="wrap" style="padding: 60px 24px;">
  <h1>{{ .Title }}</h1>
  <div class="article-body">
    {{ .Content }}
  </div>
  {{ with .Pages }}
  <ul>
    {{ range . }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
