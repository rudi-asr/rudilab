# ── ABOUT ──
about_p1: "Identitas utama saya adalah <b style=\"color:var(--text)\">riset keamanan</b> - menemukan, memvalidasi, dan menjelaskan isu keamanan dengan fokus pada pemahaman teknis yang mendalam. Tersedia untuk <b style=\"color:var(--text)\">keterlibatan jarak jauh secara global</b>, dengan pelaporan yang ramah asinkron."

about_p2: "Pekerjaan keamanan saya didasari oleh <b style=\"color:var(--text)\">pengalaman langsung 10+ tahun di dalam infrastruktur enterprise</b> - jaringan, server, virtualisasi, cloud tenant, dan pipeline DevOps yang sama kini saya nilai kelemahannya. Latar belakang ini adalah keunggulan yang disengaja: saya bisa membaca target sesuai cara ia dibangun, menemukan miskonfigurasi yang luput dari tool scan biasa, dan menghasilkan laporan yang dapat direproduksi di VM lab maupun lingkungan klien."

about_p3: "Didukung oleh sertifikasi termasuk <b style=\"color:var(--text)\">CEH, CCNA, Network Security Expert (NSE), dan VMware</b> (daftar lengkap di <a href=\"#certs\">Sertifikasi</a>)."

