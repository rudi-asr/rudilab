baseURL = "https://rudilab.my.id/"
title   = "Rudi - Offensive Security | Penetration Tester | Infrastructure Security"
theme   = "rudilab"
uglyURLs = true
defaultContentLanguage        = "en"
defaultContentLanguageInSubdir = false

[outputFormats]
  [outputFormats.print]
    mediaType = "text/html"
    baseName = "print"
    isHTML = true
    permalinkable = true

[outputs]
  # per-section outputs diatur via front matter _index.md (poc: ["html","print"])

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  codeFences = true
  noClasses = false
  style = "monokai"

[markup.tableOfContents]
  startLevel = 2
  endLevel   = 4

[languages.en]
  label       = "English"
  locale      = "en-US"
  contentDir  = "content/en"
  weight      = 1
  [languages.en.params]
    langFlag  = "EN"
    langLabel = "English"

[languages.id]
  label       = "Bahasa Indonesia"
  locale      = "id-ID"
  contentDir  = "content/id"
  weight      = 2
  [languages.id.params]
    langFlag  = "ID"
    langLabel = "Bahasa Indonesia"

[params]
  author      = "Rudi"
  description = "Offensive Security | Penetration Tester | Infrastructure Security"
  siteSlogan  = "sec-research.log"
  darkDefault = true
