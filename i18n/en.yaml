about_p1: "My core identity is <b style=\"color:var(--text)\">security research</b> - finding, validating, and explaining security issues with a focus on deep technical understanding. Available for <b style=\"color:var(--text)\">remote engagements globally</b>, with async-friendly reporting."

about_p2: "My security work is grounded on <b style=\"color:var(--text)\">10+ years hands-on inside enterprise infrastructure</b> - the same networks, servers, virtualization stacks, cloud tenants, and DevOps pipelines I now assess for weaknesses. That background is a deliberate advantage: I can read a target the way it was actually built, spot the misconfigurations that plain tool scans miss, and produce write-ups that reproduce cleanly on both a lab VM and the client's own environment."

about_thesis: "<b style=\"color:var(--text)\">Thesis:</b> <em>Analysis of network attacks against a server-based intrusion detection system, using the generic forensics framework methodology.</em> Backed further by certifications including <b style=\"color:var(--text)\">CEH, CCNA, Network Security Expert (NSE), and VMware</b> (full list in <a href=\"#certs\">Certifications</a>)."

